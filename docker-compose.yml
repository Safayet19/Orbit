services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    working_dir: /app
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/backend/app
      - --timeout-graceful-shutdown
      - "30"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
    environment:
      ADMIN_ALLOWED_ORIGINS: http://localhost:5173
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 40s
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/backend/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./requirements.txt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --strictPort
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_HOST: 0.0.0.0
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./index.html
          target: /app/index.html
        - action: sync+restart
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    working_dir: /app
    command:
      - python
      - -m
      - backend.app.docker_worker_entrypoint
      - -m
      - backend.app.cli
      - agent
      - start
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./.env
        target: /run/secrets/orbit-env
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; import sys; sys.exit(0 if b'backend.app.cli' in Path('/proc/1/cmdline').read_bytes() else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 2m
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/backend/app
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./requirements.txt
